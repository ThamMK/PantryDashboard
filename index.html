<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantry Inventory & Meal Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Pantry & Meal Planner</h1>
                <p class="text-sm text-slate-500">Live bidirectional sync with Google Sheet</p>
            </div>
            <button onclick="loadData()" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-sm font-medium hover:bg-emerald-700 transition flex items-center gap-2">
                <span>↻</span> Refresh
            </button>
        </header>

        <!-- Navigation Tabs -->
        <div class="flex gap-2 border-b border-slate-200">
            <button id="tab-btn-pantry" onclick="switchTab('pantry')" class="pb-3 px-4 text-sm font-semibold border-b-2 border-emerald-600 text-emerald-600">
                Pantry Inventory
            </button>
            <button id="tab-btn-recipes" onclick="switchTab('recipes')" class="pb-3 px-4 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700">
                Weekly Recipes
            </button>
        </div>

        <!-- TAB 1: PANTRY INVENTORY -->
        <div id="tab-pantry" class="space-y-6">
            
            <!-- Add Item Form -->
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-md font-semibold text-slate-900 mb-3">Add New Item</h2>
                <form onsubmit="addItem(event)" class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <input type="text" id="new-item" placeholder="Item Name (e.g. Salmon)" required class="px-3 py-2 border rounded-xl text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <input type="text" id="new-cat" placeholder="Category (e.g. Fridge)" class="px-3 py-2 border rounded-xl text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <input type="number" id="new-qty" placeholder="Quantity" value="1" min="1" class="px-3 py-2 border rounded-xl text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <button type="submit" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-sm font-medium hover:bg-slate-800 transition">
                        + Add Item
                    </button>
                </form>
            </section>

            <!-- Inventory List -->
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-slate-900">Current Inventory</h2>
                    <span id="item-count" class="text-xs font-semibold px-2.5 py-1 bg-slate-100 rounded-full text-slate-600">0 Items</span>
                </div>
                <div id="inventory-list" class="divide-y divide-slate-100">
                    <p class="text-sm text-slate-400 py-4">Loading pantry items...</p>
                </div>
            </section>
        </div>

        <!-- TAB 2: RECIPES -->
        <div id="tab-recipes" class="hidden space-y-6">
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 class="text-lg font-semibold text-slate-900">Current Meal Plan</h2>
                        <p class="text-xs text-slate-500">Recipes update when requested via chat assistant prompt</p>
                    </div>
                </div>
                <div id="recipes-list" class="grid gap-4 md:grid-cols-2">
                    <p class="text-sm text-slate-400 py-4">Loading recipes...</p>
                </div>
            </section>
        </div>

    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxqHPgKoP0FlK5PHees9P211cZs7PAzqddNIb8SXDA6L9_pGk-4AfUwPgLoust8r-U0fQ/exec";

        function switchTab(tab) {
            const pantryTab = document.getElementById("tab-pantry");
            const recipesTab = document.getElementById("tab-recipes");
            const btnPantry = document.getElementById("tab-btn-pantry");
            const btnRecipes = document.getElementById("tab-btn-recipes");

            if (tab === 'pantry') {
                pantryTab.classList.remove("hidden");
                recipesTab.classList.add("hidden");
                btnPantry.className = "pb-3 px-4 text-sm font-semibold border-b-2 border-emerald-600 text-emerald-600";
                btnRecipes.className = "pb-3 px-4 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700";
            } else {
                pantryTab.classList.add("hidden");
                recipesTab.classList.remove("hidden");
                btnRecipes.className = "pb-3 px-4 text-sm font-semibold border-b-2 border-emerald-600 text-emerald-600";
                btnPantry.className = "pb-3 px-4 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700";
            }
        }

        // Global JSONP callback
        function handleDataResponse(payload) {
            renderPantry(payload.pantry || []);
            renderRecipes(payload.meals || []);
        }

        function renderPantry(pantry) {
            const container = document.getElementById("inventory-list");
            document.getElementById("item-count").innerText = `${pantry.length} Items`;
            container.innerHTML = "";

            if (pantry.length === 0) {
                container.innerHTML = `<p class="text-sm text-slate-400 py-4">No pantry items found.</p>`;
                return;
            }

            pantry.forEach(item => {
                const rowDiv = document.createElement("div");
                rowDiv.className = "py-3 flex flex-col md:flex-row md:items-center justify-between gap-3";
                rowDiv.innerHTML = `
                    <div class="flex items-center gap-2 flex-grow">
                        <input type="text" value="${escapeHtml(item.item)}" 
                            onchange="updateItemField(${item.row}, 'item', this.value)"
                            class="font-medium text-slate-800 bg-transparent hover:bg-slate-100 focus:bg-white focus:outline-none focus:ring-1 focus:ring-slate-300 rounded px-2 py-1 transition w-full md:w-auto">
                        <span class="text-xs px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full whitespace-nowrap">${escapeHtml(item.category || 'General')}</span>
                    </div>

                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-1">
                            <span class="text-xs text-slate-400">Qty:</span>
                            <input type="number" value="${item.quantity}" min="0" 
                                onchange="updateItemField(${item.row}, 'quantity', this.value)"
                                class="w-16 text-sm border rounded-lg px-2 py-1 bg-slate-50 text-center focus:outline-none focus:ring-1 focus:ring-emerald-500">
                        </div>

                        <select onchange="updateItemField(${item.row}, 'status', this.value)" class="text-xs border rounded-lg p-1.5 bg-slate-50">
                            <option value="Available" ${item.status === 'Available' ? 'selected' : ''}>Available</option>
                            <option value="Low" ${item.status === 'Low' ? 'selected' : ''}>Low</option>
                            <option value="Out" ${item.status === 'Out' ? 'selected' : ''}>Out</option>
                        </select>

                        <button onclick="deleteItem(${item.row})" title="Delete Item" class="text-red-400 hover:text-red-600 p-1 rounded-lg hover:bg-red-50 transition">
                            ✕
                        </button>
                    </div>
                `;
                container.appendChild(rowDiv);
            });
        }

        function renderRecipes(meals) {
            const container = document.getElementById("recipes-list");
            container.innerHTML = "";

            if (meals.length === 0) {
                container.innerHTML = `<p class="text-sm text-slate-400 py-4">No meal plans found in sheet.</p>`;
                return;
            }

            meals.forEach(meal => {
                const card = document.createElement("div");
                card.className = "p-4 rounded-2xl border border-slate-100 bg-slate-50/50 space-y-2";
                card.innerHTML = `
                    <h3 class="font-semibold text-slate-900 text-base">${escapeHtml(meal.meal)}</h3>
                    <p class="text-xs text-emerald-700 font-medium bg-emerald-50 border border-emerald-100 px-2.5 py-1 rounded-lg inline-block">
                        Ingredients: ${escapeHtml(meal.ingredients)}
                    </p>
                `;
                container.appendChild(card);
            });
        }

        function loadData() {
            const existingScript = document.getElementById("jsonp-script");
            if (existingScript) existingScript.remove();

            const script = document.createElement("script");
            script.id = "jsonp-script";
            script.src = `${API_URL}?callback=handleDataResponse&t=${Date.now()}`;
            script.onerror = () => {
                document.getElementById("inventory-list").innerHTML = `<p class="text-sm text-red-500 py-2">Failed to load data from server.</p>`;
            };
            document.body.appendChild(script);
        }

        async function postAction(payload) {
            try {
                await fetch(API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload)
                });
                setTimeout(loadData, 500);
            } catch (err) {
                console.error("Error submitting post action:", err);
            }
        }

        function updateItemField(row, field, value) {
            const payload = { action: "updateItem", row: row };
            payload[field] = value;
            postAction(payload);
        }

        function addItem(e) {
            e.preventDefault();
            const itemInput = document.getElementById("new-item");
            const catInput = document.getElementById("new-cat");
            const qtyInput = document.getElementById("new-qty");

            postAction({
                action: "addItem",
                item: itemInput.value,
                category: catInput.value || "General",
                quantity: qtyInput.value || 1,
                status: "Available"
            });

            itemInput.value = "";
            catInput.value = "";
            qtyInput.value = "1";
        }

        function deleteItem(row) {
            if (confirm("Are you sure you want to delete this item?")) {
                postAction({ action: "deleteItem", row: row });
            }
        }

        function escapeHtml(text) {
            if (!text) return "";
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        loadData();
    </script>
</body>
</html>
