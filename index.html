<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantry Inventory & Meal Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Pantry Inventory & Meal Planner</h1>
                <p class="text-sm text-slate-500">Synced live with your Google Sheet database</p>
            </div>
            <button onclick="loadData()" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-sm font-medium hover:bg-emerald-700 transition">Refresh Data</button>
        </header>

        <!-- Inventory Section -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-lg font-semibold text-slate-900 mb-4">Current Inventory</h2>
            <div id="inventory-list" class="divide-y divide-slate-100">
                <p class="text-sm text-slate-400 py-2">Loading inventory from Google Sheets...</p>
            </div>
        </section>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxqHPgKoP0FlK5PHees9P211cZs7PAzqddNIb8SXDA6L9_pGk-4AfUwPgLoust8r-U0fQ/exec";

        async function loadData() {
            const container = document.getElementById("inventory-list");
            try {
                container.innerHTML = `<p class="text-sm text-slate-400 py-2">Loading inventory from Google Sheets...</p>`;
                
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(API_URL)}`);
                const json = await response.json();
                const data = typeof json.contents === 'string' ? JSON.parse(json.contents) : json.contents;
                
                container.innerHTML = "";

                if (!data || data.length === 0) {
                    container.innerHTML = `<p class="text-sm text-slate-400 py-2">No items found in inventory.</p>`;
                    return;
                }

                data.forEach((item, index) => {
                    const itemName = item.Item || item.item || "Unknown Item";
                    const itemCat = item.Category || item.category || "General";
                    const itemQty = item.Quantity || item.quantity || 1;
                    const itemStatus = item.Status || item.status || "Available";
                    const rowIndex = item.row || (index + 2); // Fallback to row calculation if item.row is missing

                    const rowDiv = document.createElement("div");
                    rowDiv.className = "py-3 flex items-center justify-between";
                    rowDiv.innerHTML = `
                        <div>
                            <span class="font-medium text-slate-800">${itemName}</span>
                            <span class="ml-2 text-xs px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full">${itemCat}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-sm text-slate-500">Qty: ${itemQty}</span>
                            <select onchange="updateStatus(${rowIndex}, this.value)" class="text-xs border rounded-lg p-1 bg-slate-50">
                                <option value="Available" ${itemStatus === 'Available' ? 'selected' : ''}>Available</option>
                                <option value="Low" ${itemStatus === 'Low' ? 'selected' : ''}>Low</option>
                                <option value="Out" ${itemStatus === 'Out' ? 'selected' : ''}>Out</option>
                            </select>
                        </div>
                    `;
                    container.appendChild(rowDiv);
                });
            } catch (err) {
                console.error("Load Data Error:", err);
                container.innerHTML = `<p class="text-sm text-red-500 py-2">Failed to load inventory. Please check browser console.</p>`;
            }
        }

        async function updateStatus(row, status) {
            try {
                await fetch(API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ action: "updateStatus", row: row, status: status })
                });
            } catch (err) {
                console.error("Error updating status:", err);
            }
        }

        loadData();
    </script>
</body>
</html>
